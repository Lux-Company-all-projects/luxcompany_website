<section
  class="min-h-screen flex flex-col items-center justify-center text-center px-6 bg-gradient-to-b from-gray-900 to-gray-800 text-white relative overflow-hidden"
>
  <div
    class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] animate-grid-move"
  ></div>
  <div class="absolute inset-0 bg-black opacity-10 pointer-events-none scanlines"></div>
  <h1
    class="text-xl sm:text-2xl md:text-3xl font-extrabold text-gray-300 animate-typing z-10"
  >
    Bienvenue sur Lux Company
  </h1>
  <p class="text-gray-400 mt-3 text-base sm:text-lg md:text-xl max-w-xl z-10">
    Le meilleur endroit pour les passionnés de jeux vidéo malagasy.
  </p>

  <button (click)="go_to_game_page()"
    class="mt-6 bg-red-800 hover:bg-red-700 text-white font-bold py-2 px-4 sm:py-3 sm:px-6 sm:text-lg text-sm rounded-full flex items-center justify-center gap-2 flicker z-10"
  >
    Explorer les jeux
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-5 h-5 sm:w-6 sm:h-6"
    >
      <path d="M5 12h14"></path>
      <path d="M12 5l7 7-7 7"></path>
    </svg>
  </button>
</section>
