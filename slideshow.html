<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="slide.css">
  <script src="app.js"></script>
</head>
<body>
<div class="slideshow-container">

  
  <div class="mySlides fade">
    
    <img src="manette.jpg" style="width:100%">
    
  </div>

  <div class="mySlides fade">
    
    <img src="lost_ark_mass_effect_andromeda_4k-2560x1440.jpg" style="width:100%">
    
  </div>

  <div class="mySlides fade">
    
    <img src="a_kings_demise-wallpaper-2560x1440.jpg" style="width:100%">
    
  </div>

  
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>


<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>
<style>
body, html {
  height: 100%;
}

.parallax {
  /* The image used */
  background-image: url("manette.jpg");

  /* Full height */
  height: 100%;

  /* Create the parallax scrolling effect */
  background-attachment: fixed;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
</style>
<div class="parallax"></div>
    
</body>
</html>
